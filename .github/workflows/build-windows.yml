name: Build Gajim Windows installer

# 定制版 Gajim：动态服务器发现（txt 取域名 + 程序内 63114 + 用户名模式）。
# 本仓库只放补丁与工作流；源码每次从上游固定提交拉取，保证可复现。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Disable CRLF conversion (keep LF for shell scripts)
        run: git config --global core.autocrlf false

      - name: Checkout this repo (patch + workflow)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout upstream Gajim source (pinned commit, full SHA)
        uses: actions/checkout@v4
        with:
          repository: gajim/gajim
          ref: b3a40f2fcae0564c7892fad21caded759e9ab78a
          path: gajim

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Apply customization patch
        shell: msys2 {0}
        working-directory: gajim
        run: |
          git config --global core.autocrlf false
          git apply --check ../custom/gajim-dynamic-server.patch
          git apply ../custom/gajim-dynamic-server.patch
          echo "patch applied"

      - name: Skip MSIX packaging (upstream path typo in _base.sh)
        shell: msys2 {0}
        working-directory: gajim
        run: |
          # 上游 win/_base.sh 的 build_msix_installer 里图标路径写成
          # ${DIR}/..src/gajim/...（应为 ${DIR}/../src/gajim/...），
          # rsvg-convert 找不到文件导致整个构建在最后一步失败。
          # 本定制只需 NSIS 的 .exe 安装包，这里在 runner 的副本里
          # 去掉 MSIX 一步；仓库里的上游脚本保持原样不动。
          sed -i '/^    build_msix_installer$/d' win/build.sh
          grep -q "build_msix_installer" win/build.sh && echo "MSIX step still present!" && exit 1 || echo "MSIX step removed, NSIS installers only"

      - name: Build installer
        shell: msys2 {0}
        working-directory: gajim
        run: ./win/build.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gajim-installer
          path: gajim/win/_build_root/*.exe
          if-no-files-found: error
