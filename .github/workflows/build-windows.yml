name: Build Gajim Windows portable

# 定制版 Gajim：动态服务器发现（txt 取域名 + 程序内 63114 + 用户名模式）。
# 本仓库只放补丁与工作流；源码每次从上游固定提交拉取，保证可复现。
# 产物为解压即运行的便携版 ZIP，不做安装包。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Disable CRLF conversion (keep LF for shell scripts)
        run: git config --global core.autocrlf false

      - name: Checkout this repo (patch + workflow)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout upstream Gajim source (pinned commit, full SHA)
        uses: actions/checkout@v4
        with:
          repository: gajim/gajim
          ref: b3a40f2fcae0564c7892fad21caded759e9ab78a
          path: gajim

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Apply customization patch
        shell: msys2 {0}
        working-directory: gajim
        run: |
          git config --global core.autocrlf false
          git apply --check ../custom/gajim-dynamic-server.patch
          git apply ../custom/gajim-dynamic-server.patch
          echo "patch applied"

      - name: Remove stale Pango 1.56.4 pin (breaks current GTK4)
        shell: msys2 {0}
        working-directory: gajim
        run: |
          # 上游 win/_base.sh 把 Pango 钉死在 1.56.4-3（躲某个 Pango 回归 bug）。
          # 但仓库现在的 GTK4 调用 pango_attr_width_new（Pango 1.58 才引入），
          # 钉死的 1.56.4 没有这个函数，启动报“无法定位程序输入点”，
          # 整个应用打不开。去掉钉死，让 pacman 装与当前 GTK4 一致的 Pango。
          # 这里只改 runner 的副本，仓库里的上游脚本保持原样不动。
          sed -i '/Downgrade pango/d; /pango-1.56.4-3/d' win/_base.sh
          grep -q "pango-1.56" win/_base.sh && echo "Pango pin still present!" && exit 1 || echo "Pango pin removed, pacman will install consistent Pango+GTK4"

      - name: Add retry for transient download failures (pacman + pip)
        shell: msys2 {0}
        working-directory: gajim
        run: |
          # 构建时 pacman/pip 下载偶发失败（仓库同步、CDN 抖动），
          # 失败一次就葬送整轮 40 分钟构建。追加同名函数覆盖原定义
          # （bash 中后定义覆盖先定义），每条命令失败重试 3 次。
          # 这里只改 runner 的副本，仓库里的上游脚本保持原样不动。
          cat >> win/_base.sh <<'EOF'

          # CI robustness: retry transient download failures (repo/CDN hiccups).
          # Overrides the build_pacman / build_pip_install definitions above.
          function build_pacman {
              local attempt=1
              while [ $attempt -le 3 ]; do
                  if pacman --root "${BUILD_ROOT}" "$@"; then
                      return 0
                  fi
                  echo "build_pacman attempt $attempt failed, retrying in 10s..."
                  sleep 10
                  attempt=$((attempt + 1))
              done
              echo "build_pacman failed after 3 attempts"
              return 1
          }

          function build_pip_install {
              local attempt=1
              while [ $attempt -le 3 ]; do
                  if "${BUILD_ROOT}"/"${MSYSTEM_PREFIX:1}"/bin/"${PYTHON_ID}".exe -m pip install --break-system-packages "$@"; then
                      return 0
                  fi
                  echo "build_pip_install attempt $attempt failed, retrying in 10s..."
                  sleep 10
                  attempt=$((attempt + 1))
              done
              echo "build_pip_install failed after 3 attempts"
              return 1
          }
          EOF
          bash -n win/_base.sh && echo "_base.sh syntax OK after retry patch"

      - name: Skip installers (NSIS + MSIX), portable ZIP only
        shell: msys2 {0}
        working-directory: gajim
        run: |
          # 不做安装包：去掉 NSIS 与 MSIX 两步，只保留程序本体构建。
          # （MSIX 另有上游笔误：_base.sh 图标路径写成 ${DIR}/..src/...，
          # 应为 ${DIR}/../src/...；跳过即避开。）
          # 这里只改 runner 的副本，仓库里的上游脚本保持原样不动。
          sed -i '/^    build_exe_installer$/d; /^    build_msix_installer$/d' win/build.sh
          grep -q "build_exe_installer\|build_msix_installer" win/build.sh && echo "installer step still present!" && exit 1 || echo "installer steps removed, portable ZIP only"

      - name: Build program files
        shell: msys2 {0}
        working-directory: gajim
        run: ./win/build.sh

      - name: Prepare portable folder
        shell: msys2 {0}
        working-directory: gajim
        run: |
          cd win/_build_root
          # 构建产物 ucrt64/ 就是完整运行环境（bin/lib/share/etc/ssl），
          # 便携版 NSIS 也是原样拷贝这棵树。改名为 Gajim。
          mv ucrt64 Gajim
          # is_portable 标记必须放在 bin/（与 Gajim.exe 同目录），
          # Gajim 据此走便携模式：配置存程序目录，不写 %APPDATA%。
          touch Gajim/bin/is_portable
          ls -la Gajim/bin/Gajim.exe Gajim/bin/is_portable

      - name: Upload portable folder immediately (do not wait for ZIP)
        # 即时上传铁律：程序目录一就绪马上上传，不等 ZIP 打包；
        # 打包失败也不丢已生成文件。
        uses: actions/upload-artifact@v4
        with:
          name: gajim-portable-folder
          path: gajim/win/_build_root/Gajim/
          if-no-files-found: error

      - name: Package portable ZIP (extract and run)
        shell: msys2 {0}
        working-directory: gajim
        run: |
          cd win/_build_root
          7z a -tzip -mx=5 Gajim-Portable.zip Gajim
          ls -la Gajim-Portable.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gajim-portable
          path: gajim/win/_build_root/*.zip
          if-no-files-found: error

      - name: Upload built files on failure (rescue, do not lose an hour of build)
        # 兜底：前面任何一步失败，已生成的文件也要上传，不让一小时构建白跑。
        # 成功时不执行；失败时把 ZIP（若已生成）和程序目录（Gajim/ 或未改名的 ucrt64/）
        # 原样传上来，用户仍可下载使用或排查。任一路径不存在则跳过该路径。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gajim-built-files-rescue
          path: |
            gajim/win/_build_root/Gajim-Portable.zip
            gajim/win/_build_root/Gajim/
            gajim/win/_build_root/ucrt64/
          if-no-files-found: warn
